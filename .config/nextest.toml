# cargo-nextest, the gate's test runner (xtask/src/testrun.rs), pinned in tools/build-tools.json.
[profile.default]
# Report slow tests at 5 s. The 120 periods retain the existing ten-minute hang guard.
slow-timeout = { period = "5s", terminate-after = 120 }
# Fail instead of passing when a test leaves a process behind that holds its output open.
leak-timeout = { period = "1s", result = "fail" }
