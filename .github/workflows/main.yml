# Nightly and by hand: the whole default gate on main (without perf: ratio guards are load sensitive on shared
# runners and stay a local gate), split into parallel jobs with `cargo xtask step <id>` so the wall time is the
# slowest job: the release-profile tests with LTO, coverage and the base doctor run only here; cargo-deny with the
# day's advisories; the image. A push to main runs no gate here: the merge queue already ran pr.yml on that tree,
# and pr.yml's push run only warms the PR caches.
name: Main
on:
  schedule:
    - cron: '17 2 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-${{ github.event_name }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  OOS_GATE_BASE: origin/main
jobs:
  gate:
    name: gate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            steps: fmt size architecture mutable-statics unsafe method-exceptions known-failures agent-rules test-time
          - name: clippy
            steps: clippy
          - name: tests-debug
            steps: tests-debug
            nextest: nextest
          - name: tests-release
            steps: tests-release
            nextest: nextest
          - name: python
            steps: script-syntax python-tests
            mksh: true
          - name: coverage
            steps: doctor-base coverage
            llvm-cov: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: matrix.nextest
        with:
          tool: cargo-nextest@0.9.150
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: matrix.llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Hooks path (doctor checks it)
        run: git config core.hooksPath .githooks
      # script-syntax checks the one mksh script with mksh.
      - name: mksh
        if: matrix.mksh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mksh
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: nightly-${{ matrix.name }}
      # tools/output.py builds offline.
      - name: Locked crates
        run: cargo fetch --locked
      - name: cargo xtask step ${{ matrix.steps }}
        env:
          STEPS: ${{ matrix.steps }}
          OOS_TEST_RUNNER: ${{ matrix.nextest }}
        shell: bash
        run: |
          read -ra ids <<< "$STEPS"
          cargo xtask step "${ids[@]}"

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, bans, sources (deny.toml)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo deny --locked check

  image:
    uses: ./.github/workflows/image.yml

  timings:
    needs: [gate, deny, image]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Job and step durations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python3 -I tools/ci/run_summary.py --repo "$REPO" --run "$RUN_ID" --attempt "$ATTEMPT" --exclude timings
