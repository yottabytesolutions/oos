# Nightly and by hand: the whole default gate on main (without perf: ratio guards are load sensitive on shared
# runners and stay a local gate), split into parallel jobs with `cargo xtask step <id>` so the wall time is the
# slowest job: the release-profile tests, coverage and the base doctor run only here; cargo-deny with the
# day's advisories; a FreeBSD cross check; the image. A push to main runs no gate here: the merge queue already ran
# pr.yml on that tree, and pr.yml's push run only warms the PR caches.
name: Main
on:
  schedule:
    - cron: '17 2 * * *'
  pull_request:
    paths: ['fuzz/**']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: main-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  OOS_GATE_BASE: origin/main
jobs:
  gate:
    if: github.event_name != 'pull_request'
    name: gate (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: fast
            steps: fmt size architecture mutable-statics unsafe method-exceptions known-failures agent-rules test-time links text
          - name: clippy
            steps: clippy plan-matrix
          - name: decoders
            steps: decoders
          - name: tests-debug
            steps: tests-debug
            nextest: nextest
          - name: tests-release
            steps: tests-release
            nextest: nextest
          - name: coverage
            steps: doctor-base coverage
            nextest: nextest
            llvm-cov: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: matrix.nextest
        with:
          tool: cargo-nextest@0.9.151
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: matrix.llvm-cov
        with:
          tool: cargo-llvm-cov@0.9.1
      - name: Hooks path (doctor checks it)
        run: git config core.hooksPath .githooks
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-workspace-crates: true
          shared-key: nightly-${{ matrix.name }}
          # a dispatch on another branch must not fill the cache storage
          save-if: ${{ github.ref == 'refs/heads/main' }}
      # tools/output.py builds offline.
      - name: Locked crates
        run: cargo fetch --locked
      - name: cargo xtask step ${{ matrix.steps }}
        env:
          STEPS: ${{ matrix.steps }}
        shell: bash
        run: |
          read -ra ids <<< "$STEPS"
          cargo xtask step "${ids[@]}"

  python:
    if: github.event_name != 'pull_request'
    name: gate (python)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OOS_PYTHON_NO_RUST: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      # script-syntax checks the one mksh script with mksh.
      - name: mksh
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mksh
      - name: Script syntax and Python tests (tools/tests, tools/privacy, ui/tools)
        run: |
          python3 -I tools/script_syntax.py
          python3 -I tools/python_tests.py

  deny:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-deny@0.20.2
      - name: Licences, advisories, bans, sources (deny.toml)
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo deny --locked check

  # Host tooling builds on the BSDs too (issue 10): a cross check of every crate for FreeBSD, no FreeBSD runner.
  freebsd:
    if: github.event_name != 'pull_request'
    name: freebsd (cross check)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned toolchain (rust-toolchain.toml) and the FreeBSD standard library
        run: |
          rustup toolchain install
          rustup target add x86_64-unknown-freebsd
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          shared-key: nightly-freebsd
      - name: cargo check --target x86_64-unknown-freebsd
        run: cargo check --locked --workspace --all-targets --target x86_64-unknown-freebsd

  image:
    if: github.event_name != 'pull_request'
    uses: ./.github/workflows/image.yml

  timings:
    needs: [gate, python, deny, freebsd, image]
    if: always() && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Job and step durations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python3 -I tools/ci/run_summary.py --repo "$REPO" --run "$RUN_ID" --attempt "$ATTEMPT" --exclude timings

  fuzz:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pinned nightly (fuzz/rust-toolchain.toml)
        working-directory: fuzz
        run: rustup toolchain install
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: cargo-fuzz@0.13.1
      - name: Locked fuzz dependencies
        working-directory: fuzz
        run: cargo fetch --locked
      - name: Fuzz every parser for 60 seconds
        working-directory: fuzz
        shell: bash
        env:
          CARGO_NET_OFFLINE: "true"
        run: |
          failed=0
          targets=$(cargo fuzz list)
          for target in $targets; do
            cargo fuzz run "$target" -- -max_total_time=60 || failed=1
          done
          exit "$failed"
      - name: Preserve failing fuzz inputs
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          if-no-files-found: ignore
