# `cargo xtask <command>` from the repository root runs the gate (docs/development.md).
[alias]
xtask = "run --locked --quiet --manifest-path xtask/Cargo.toml --"

# The scope build (boot/build-dev-image.sh) and the gate's scope check: static, linked by rust-lld, tuned for the A53 cores that place records.
[target.aarch64-unknown-linux-musl]
linker = "rust-lld"
rustflags = ["-C", "target-feature=+crt-static", "-C", "target-cpu=cortex-a53"]
