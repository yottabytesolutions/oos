# Model defaults shared by the supported DHO800/DHO900 models.
# Device overrides in /oos/system.conf win, including empty values.
net.allow = onlink 169.254.0.0/16 fe80::/10 onlink6
net.ipv6 = on
remote.ssh = off
xdma.params = poll_mode=0
acq.pipeline = batch
perf.place = on
acq.prearm = on
acq.compress = on
ntp = on
tz = dhcp
tz.fallback = CET-1CEST,M3.5.0,M10.5.0/3
