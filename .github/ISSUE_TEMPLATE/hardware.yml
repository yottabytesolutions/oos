name: Hardware finding
description: How the scope hardware behaves, measured or observed; or results from another model
labels: [risk/hardware]
body:
  - type: markdown
    attributes:
      value: >-
        Describe behaviour and how it is known (measurement, probe, experiment). No vendor code, listings, tables,
        strings or files. No serial numbers, MAC addresses, licence keys or calibration data.
  - type: input
    id: model
    attributes:
      label: Model and hardware revision
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OOS version and build
  - type: textarea
    id: finding
    attributes:
      label: Finding
      description: What the hardware does. Registers by function and address are fine; vendor material is not.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: How it is known
      description: Setup, instruments, signal, repeatability.
    validations:
      required: true
  - type: textarea
    id: impact
    attributes:
      label: Impact on OOS
