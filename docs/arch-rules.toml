# Architecture rules for oos-ui, checked by tools/check/ in the gate.
# Format is provisional until it matches the shared checker's format (auxout). Semantics are fixed:
# a module may `use` only the modules listed in `may_use`; `forbid` lists paths it must never name.
# Section anchors refer to docs/architecture.md.

[limits]                       # architecture.md#size-limits, adr/0010
file_lines = 400               # test modules excluded
fn_lines = 60
struct_fields = 12
allowlist = "tools/check/size-allowlist.txt"   # shrink-only

[layer.domain]                 # architecture.md#layers
modules = ["settings", "command", "change", "picture::model", "records::measure"]
may_use = ["oos_dsp", "std", "settings", "command", "change"]
forbid = ["std::fs", "std::net", "std::thread", "std::time::Instant", "std::time::SystemTime", "libc", "oos_hal"]

[layer.application]
modules = ["app", "picture", "records", "compose", "views", "menus"]
may_use = ["domain", "ports", "oos_dsp", "std"]
forbid = ["oos_hal", "libc", "std::fs", "std::net"]

[layer.ports]                  # architecture.md#ports-and-adapters
traits = [
  "board::Board",
  "display::Present",
  "input::Source",
  "remote::Transport",
  "store::Files",
  "clock::Clock",
  "instruments::Bulk",
  "protocols::Protocol",
]

[layer.adapters]
modules = ["board::dho", "display", "input", "remote", "store", "system", "instruments", "protocols"]
may_use = ["domain", "ports", "std", "libc"]
no_cross = true                # adapters do not use each other

[exclusive]                    # one user per outside interface
"oos_hal::dho" = ["board::dho"]
"drm" = ["display"]
"gpu" = ["display"]
"vpu" = ["display"]

[writes]                       # architecture.md#state-and-ownership
# Types whose fields are private and whose `&mut` methods may be called only from the listed modules.
"settings::Settings" = ["change"]           # the change stage owns Settings
"change::Generations" = ["change"]
"picture::Accumulator" = ["picture"]

[pub_fields]
deny_in = ["settings", "change", "picture", "records", "app"]
