# The Rust crates of OOS, built together: one Cargo.lock, one target/ (docs/development.md).
# gpu/ is C (gpu/oos-gpu.c), built in its own container by gpu/build.sh and gpu/test-host.sh.
[workspace]
members = ["hal", "dsp", "ui", "fpgad", "xtask"]
resolver = "2"

# The scope's binaries (oos-ui, oos-fpgad, oos-update): oos-ui's profile from before the workspace. oos-fpgad had
# the same without codegen-units = 1; one profile now holds both (LTO merges the units anyway).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# The release profile hal had before the workspace (no LTO, default codegen units, unwinding). tools/perf-guard.sh
# runs hal's timing guards with it: their ratios were measured there, and LTO changes them (1.5x instead of 2x for
# the fused decode).
[profile.perf]
inherits = "release"
lto = false
codegen-units = 16
panic = "unwind"
