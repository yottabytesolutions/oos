# The Rust crates of OOS, built together: one Cargo.lock, one target/ (docs/development.md).
# gpu/ is C (gpu/oos-gpu.c), built in its own container by gpu/build.sh and gpu/test-host.sh.
[workspace]
members = ["hal", "dsp", "core", "ui", "fpgad", "xtask"]
exclude = ["fuzz"]
resolver = "2"

# The scope's binaries (oos-ui, oos-fpgad, oos-update): oos-ui's profile from before the workspace. oos-fpgad had
# the same without codegen-units = 1; one profile now holds both (LTO merges the units anyway).
[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
debug = false

# The release tests (`cargo xtask check`, CI): release optimisation and no debug assertions, without a fat-LTO link per
# test binary (xtask/src/testrun.rs). HAL's timing guards use these same non-LTO, unwinding test artifacts.
[profile.test-release]
inherits = "release"
lto = false
codegen-units = 16

# Keep file/line backtraces without full variable/type debug info in host builds and tests.
[profile.dev]
debug = "line-tables-only"

# Cargo applies this wildcard only to dependencies outside the workspace.
[profile.dev.package."*"]
debug = false

# Upstream (PR 8): long-reference DSP and Eye analysis stay responsive in a debug build; the UI keeps the fast
# incremental development build.
[profile.dev.package.oos-dsp]
opt-level = 2

# The gate parses every source file with syn on each run (`cargo xtask check`); unoptimized that takes 5 s. xtask
# itself stays unoptimized: its coverage is measured on the dev build.
[profile.dev.package.syn]
opt-level = 2

[profile.dev.package.proc-macro2]
opt-level = 2

# Rescue-set tests hash complete card regions; keep the compression rounds optimized without changing debug checks.
[profile.test.package.sha2]
opt-level = 2

# UI tests exercise the software renderer and exhaustive layouts, also through the host-script and soak binaries.
# Debug assertions and overflow checks remain enabled.
[profile.test.package.oos-ui]
opt-level = 1

# Shared policy; existing findings are frozen per file by the gate (ADR 0006).
[workspace.lints.rust]
unused = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -2 }
pedantic = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"
use_self = "warn"
option_if_let_else = "warn"
manual_let_else = "warn"
redundant_else = "warn"
needless_pass_by_value = "warn"
items_after_statements = "warn"
module_name_repetitions = "warn"
struct_field_names = "warn"
enum_variant_names = "warn"
similar_names = "warn"
many_single_char_names = "warn"
fn_params_excessive_bools = "warn"
struct_excessive_bools = "warn"
wildcard_imports = "warn"
unnested_or_patterns = "warn"
semicolon_if_nothing_returned = "warn"
unwrap_used = "warn"
expect_used = "warn"
allow_attributes_without_reason = "warn"
# DSP and pixel/register conversions intentionally narrow after domain bounds checks.
cast_possible_truncation = "allow"
# Sample, pixel and register arithmetic intentionally crosses signed representations.
cast_sign_loss = "allow"
# DSP uses floating-point approximations of sample indices and counters.
cast_precision_loss = "allow"
# Register and sample bit patterns intentionally cross signed representations.
cast_possible_wrap = "allow"
# `as` keeps mixed numeric DSP expressions readable, including widening conversions.
cast_lossless = "allow"
# Hex register values and measured constants use the hardware/domain notation.
unreadable_literal = "allow"
# Public getters are already used by their callers; blanket annotations obscure the API.
must_use_candidate = "allow"
# Builder return values follow the same convention as other value-returning APIs.
return_self_not_must_use = "allow"
# Exact comparisons are intentional for discrete values and synthetic DSP fixtures.
float_cmp = "allow"
# Making 500 existing APIs const would expand the compatibility contract without a user benefit.
missing_const_for_fn = "allow"
