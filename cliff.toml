# git-cliff: the release notes from the Conventional Commit subjects on main (rebase merges: every commit of a PR).
# release.yml runs `git-cliff --latest`; locally: git-cliff --unreleased.
[changelog]
header = "# Changelog\n"
body = """
{% if version %}## {{ version | trim_start_matches(pat="v") }} ({{ timestamp | date(format="%Y-%m-%d") }}){% else %}## Unreleased{% endif %}
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}- {% if commit.scope %}{{ commit.scope }}: {% endif %}{% if commit.breaking %}**breaking** {% endif %}{{ commit.message | split(pat="\n") | first | trim }}
{% endfor %}{% endfor %}
"""
footer = ""
trim = true

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = true
filter_commits = false
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^build\\(deps\\)", skip = true },
    { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
    { message = "^chore", skip = true },
    { message = ".*", skip = true },
]
