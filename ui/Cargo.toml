[package]
name = "oos-ui"
version = "0.1.13"
repository = "https://github.com/deckerjulian/oos"
edition = "2021"
description = "OOS oscilloscope user interface for the Rigol DHO800/DHO900 (software renderer on DRM/KMS, touch, front panel)"
license = "GPL-2.0-or-later"

# The lint set of every crate (docs/development.md). Existing findings are held by the clippy ratchet of
# `cargo xtask check`; new ones fail it.
[lints.rust]
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

# GlobalAlloc must observe the UI and workers in the same process. A separate binary cannot expose
# its allocations to the integration test. Reuse the module graph; disable duplicate test/bench suites.
[lib]
path = "src/main.rs"
test = false
doctest = false
bench = false

# Decoders beyond the seven core ones (UART, I2C, SPI, CAN, LIN, Parallel, C-PHY, always built), one feature per
# file in src/protocols. All are on by default; a build without some: `--no-default-features --features "..."`, or
# OOS_DECODERS / OOS_DECODERS_OFF with build.sh and boot/build-dev-image.sh (tools/decoder-features.sh).
[features]
default = ["decoders"]
decoders = ["dec-dmx512", "dec-spdif", "dec-usbpd", "dec-dcc", "dec-linecode", "dec-serial", "dec-onewire", "dec-debug", "dec-qspi", "dec-i3c", "dec-vehicle", "dec-avionics", "dec-i2s", "dec-usb"]
dec-dmx512 = []
dec-spdif = []
dec-usbpd = []
dec-dcc = []
dec-linecode = []
dec-serial = []
dec-onewire = []
dec-debug = []
dec-qspi = []
dec-i3c = []
dec-vehicle = []
dec-avionics = []
dec-i2s = []
dec-usb = []

[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }
oos-dsp = { path = "../dsp" }
oos-core = { path = "../core" }
