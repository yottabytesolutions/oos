# A SemVer tag vX.Y.Z on main: test the release tools, build the unsigned image and provenance, and draft a release.
# The maintainer builds the signed artifacts offline (docs/release.md).
# Production code is compared with the previous release (ADR 0007): growth needs a `Code growth:` paragraph.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      code: ${{ steps.code.outputs.notes }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main and matches the crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          versions=$(grep -h '^version = ' core/Cargo.toml dsp/Cargo.toml fpgad/Cargo.toml hal/Cargo.toml ui/Cargo.toml xtask/Cargo.toml | sort -u)
          [ "$versions" = "version = \"${TAG#v}\"" ] || { echo "::error::$TAG does not match the crate versions: $versions"; exit 1; }
      - name: Pinned toolchain (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Test release packaging with temporary keys
        run: |
          cargo build --locked -p oos-fpgad --bin oos-update
          OOS_RELEASE_TEST_UPDATER="$PWD/target/debug/oos-update" \
            python3 -I -m unittest discover -s tools/tests -p 'test_release_artifacts.py' -v
      - name: Production code since the previous release, growth explained
        id: code
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          # the highest final release vX.Y.Z before this commit; no rc or build suffixes
          prev=$(git tag --merged "$GITHUB_SHA^" --sort=-v:refname | grep -Ex 'v[0-9]+\.[0-9]+\.[0-9]+' | sed -n 1p || true)
          compare=()
          if [ -n "$prev" ]; then compare=(--compare "$prev"); fi
          cargo xtask loc "${compare[@]}" --json > "$RUNNER_TEMP/loc.json"
          cargo xtask loc "${compare[@]}" > "$RUNNER_TEMP/loc.md"
          # the annotation from the API: the checkout may hold the tag as a lightweight one
          obj=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object | select(.type == "tag") | .sha')
          if [ -n "$obj" ]; then gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj" --jq .message; fi > "$RUNNER_TEMP/tag.txt"
          python3 -I tools/ci/code_growth.py --loc "$RUNNER_TEMP/loc.json" --table "$RUNNER_TEMP/loc.md" \
            --tag-message "$RUNNER_TEMP/tag.txt" --changelog CHANGELOG.md --version "${TAG#v}" > "$RUNNER_TEMP/notes.md"
          { echo 'notes<<CODE_NOTES_END'; cat "$RUNNER_TEMP/notes.md"; echo 'CODE_NOTES_END'; } >> "$GITHUB_OUTPUT"

  image:
    needs: verify
    uses: ./.github/workflows/image.yml

  release:
    needs: [verify, image]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oos-image
          path: artifacts
      - name: Release files (unsigned image, build ID, models and manifest)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          img=$(find artifacts -name oos-dev.img -type f)
          dir=$(dirname "$img")
          cp "$img" "dist/oos-$TAG.img"
          cp "$dir/oos-dev.build" "dist/oos-$TAG.build"
          cp "$dir/oos-dev.models" "dist/oos-$TAG.models"
          cp "$dir/manifest.txt" "dist/oos-$TAG.manifest.txt"
          (cd dist && sha256sum -- * > SHA256SUMS.unsigned)
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        with:
          tool: git-cliff@2.14.2
      - name: Changelog and production code
        env:
          CODE: ${{ needs.verify.outputs.code }}
        run: |
          git-cliff --config cliff.toml --latest --strip header --output dist/CHANGELOG.md
          printf '\n%s\n' "$CODE" >> dist/CHANGELOG.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        id: provenance
        with:
          subject-path: |
            dist/oos-*
            dist/SHA256SUMS.unsigned
      - name: Release attestation files
        env:
          BUNDLE: ${{ steps.provenance.outputs.bundle-path }}
        run: python3 -I tools/ci/attestation_assets.py "$BUNDLE" dist/oos-* dist/SHA256SUMS.unsigned
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "OOS $TAG" \
            --notes-file dist/CHANGELOG.md dist/oos-* dist/SHA256SUMS*
