# The gate (`cargo xtask check`, docs/development.md) and the script syntax checks. Without hardware: tests that need
# the calibration files of a real unit skip themselves.
name: CI
on:
  push:
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          # the ratchet files are checked against the merge base with overhaul
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - name: Pinned build tools and doctor
        run: tools/bootstrap.sh
      - name: Gate
        run: cargo xtask check
      - name: Python and shell syntax
        run: |
          python3 -m py_compile boot/*.py tools/*.py
          for f in boot/*.sh boot/gel/*.sh kernel/*.sh rootfs/*.sh tools/*.sh rootfs/initramfs/bin/* rootfs/initramfs/etc/rcS .githooks/*; do
            sh -n "$f" || exit 1
          done
