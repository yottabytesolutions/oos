# Publishes wiki/ to the GitHub wiki on every push to main that changes it, so the wiki never drifts from the reviewed
# source. Edits made in the wiki's web interface are overwritten. GitHub creates the wiki's Git repository only when
# its first page is saved in the web interface; until then this job fails and says so.
name: Wiki
on:
  push:
    branches: [main]
    paths:
      - 'wiki/**'
      - '.github/workflows/wiki.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: wiki
  cancel-in-progress: false
jobs:
  publish:
    # Only main is published, also when the workflow is started by hand.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      # The head of main when the job runs, not the commit that started it: a retried or overtaken run publishes the
      # newest reviewed pages, never older ones, and a later push that does not touch wiki/ loses nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          persist-credentials: false
      - name: Publish wiki/ to the wiki
        env:
          TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          set -eu
          url="https://x-access-token:${TOKEN}@github.com/${REPO}.wiki.git"
          if ! git ls-remote "$url" HEAD >/dev/null 2>&1; then
            echo "::error::The wiki repository ${REPO}.wiki.git does not exist yet. Save a first page in the wiki's web interface (Wiki > Create the first page), then run this workflow again."
            exit 1
          fi
          sha=$(git rev-parse HEAD)
          dest="$RUNNER_TEMP/wiki"
          git clone --quiet --depth 1 "$url" "$dest"
          rsync -a --delete --exclude .git wiki/ "$dest/"
          cd "$dest"
          git add -A
          if git diff --cached --quiet; then
            echo "The wiki already matches wiki/ at ${sha}."
            exit 0
          fi
          git -c user.name='github-actions[bot]' \
            -c user.email='41898282+github-actions[bot]@users.noreply.github.com' \
            commit --quiet -m "Publish wiki/ from ${REPO}@${sha}"
          git push --quiet origin HEAD
