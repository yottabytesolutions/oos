# A SemVer tag vX.Y.Z on main: the image, the unsigned image and build id for offline signing, a changelog from the
# Conventional Commit subjects (cliff.toml), build provenance, and a draft GitHub release. No signing key here:
# the maintainer signs the update package offline (boot/sign-dev-image.sh --key) and attaches it before publishing.
name: Release
on:
  push:
    tags: ['v[0-9]+.[0-9]+.[0-9]+']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Tag is on main and matches the crate versions
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || { echo "::error::$TAG is not on main"; exit 1; }
          versions=$(grep -h '^version = ' core/Cargo.toml dsp/Cargo.toml fpgad/Cargo.toml hal/Cargo.toml ui/Cargo.toml xtask/Cargo.toml | sort -u)
          [ "$versions" = "version = \"${TAG#v}\"" ] || { echo "::error::$TAG does not match the crate versions: $versions"; exit 1; }

  image:
    needs: verify
    uses: ./.github/workflows/image.yml

  release:
    needs: image
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: oos-image
          path: artifacts
      - name: Release files (unsigned image, build id, checksums)
        env:
          TAG: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir dist
          img=$(find artifacts -name oos-dev.img -type f)
          dir=$(dirname "$img")
          cp "$img" "dist/oos-$TAG.img"
          cp "$dir/oos-dev.build" "dist/oos-$TAG.build"
          cp "$dir/oos-dev.unit" "dist/oos-$TAG.unit"
          cp "$dir/manifest.txt" "dist/oos-$TAG.manifest.txt"
          (cd dist && sha256sum -- * > SHA256SUMS)
      - name: Changelog
        uses: orhun/git-cliff-action@a9a95522b26fe6403f7bb24031f21fb573d0f5ff # v4.9.1
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          OUTPUT: dist/CHANGELOG.md
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/oos-*
      - name: Draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --verify-tag --title "OOS $TAG" \
            --notes-file dist/CHANGELOG.md dist/oos-* dist/SHA256SUMS
