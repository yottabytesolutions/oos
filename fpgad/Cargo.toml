[package]
name = "oos-fpgad"
version = "0.1.12"
repository = "https://github.com/deckerjulian/oos"
edition = "2021"
description = "OOS acquisition control for the Rigol DHO800/DHO900 (plan / run one acquisition)"
license = "GPL-2.0-or-later"

# The lint set of every crate (docs/development.md). Existing findings are held by the clippy ratchet of
# `cargo xtask check`; new ones fail it.
[lints.rust]
unused = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"

[dependencies]
libc = "0.2"
oos-hal = { path = "../hal" }

[profile.release]
lto = true
panic = "abort"
opt-level = 3
