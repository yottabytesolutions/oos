[package]
name = "xtask"
version = "0.2.1"
edition = "2021"
description = "The repository gate: cargo xtask check (docs/development.md)"
license = "GPL-2.0-or-later"
publish = false

# xtask has no ratchet: every finding fails its own gate.
[lints.rust]
unused = { level = "deny", priority = -1 }
missing_debug_implementations = "deny"

[lints.clippy]
all = { level = "deny", priority = -1 }
too_many_lines = "deny"
cognitive_complexity = "deny"
too_many_arguments = "deny"
type_complexity = "deny"
large_enum_variant = "deny"
unwrap_used = "deny"
undocumented_unsafe_blocks = "deny"
missing_safety_doc = "deny"

[dependencies]
libc = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }

[dev-dependencies]
# Test-only: the workflows are YAML (src/stack_ci.rs). No default features: no encoding detection.
yaml-rust2 = { version = "0.13", default-features = false }
