[package]
name = "oos-fuzz"
version = "0.0.0"
publish = false
edition = "2021"
license = "GPL-2.0-or-later"

[package.metadata]
cargo-fuzz = true

[dependencies]
hyper = { version = "1", default-features = false, features = ["http1", "server"] }
libfuzzer-sys = "0.4"
oos-ui = { path = "../ui" }
oos-hal = { path = "../hal" }

[[bin]]
name = "scpi"
path = "fuzz_targets/scpi.rs"
test = false
doc = false
bench = false

[[bin]]
name = "isf"
path = "fuzz_targets/isf.rs"
test = false
doc = false
bench = false

[[bin]]
name = "wfm"
path = "fuzz_targets/wfm.rs"
test = false
doc = false
bench = false

[[bin]]
name = "ag"
path = "fuzz_targets/ag.rs"
test = false
doc = false
bench = false

[[bin]]
name = "setup"
path = "fuzz_targets/setup.rs"
test = false
doc = false
bench = false

[[bin]]
name = "update"
path = "fuzz_targets/update.rs"
test = false
doc = false
bench = false

[[bin]]
name = "http"
path = "fuzz_targets/http.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mdns"
path = "fuzz_targets/mdns.rs"
test = false
doc = false
bench = false
