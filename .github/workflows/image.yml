# The unsigned image is built: kernel, initramfs and boot image. Natively on
# a GitHub-hosted arm64 runner. Called by main.yml (nightly) and release.yml (tags); by hand from the Actions tab.
# Releases publish the unsigned image and metadata; the project signs and packages releases offline.
name: Image
on:
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
env:
  CARGO_INCREMENTAL: 0
jobs:
  image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 120
    env:
      CARGO_TARGET_DIR: ${{ github.workspace }}/target
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Rust (rust-toolchain.toml)
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          command -v rustup >/dev/null || { echo "rustup is required on the Ubuntu runner" >&2; exit 1; }
          rustup toolchain install
          cargo fetch --locked
      - name: Kernel source (pre-release kernel-base-<version>, kernel/base.sha256 checks it)
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/ci/kernel-base.sh download
      - name: Kernel
        run: kernel/build-base.sh
      # an older cache is fine: dep_fetch checks every file against deps.lock and fetches what is missing
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: rootfs/out/sources
          key: build-sources-${{ hashFiles('rootfs/deps.lock') }}
          restore-keys: build-sources-
      - name: Image
        run: boot/build-dev-image.sh
      - name: Manifest
        run: |
          python3 -I tools/image-manifest.py kernel/out/base/Image "$CARGO_TARGET_DIR/image/oos-dho900.dtb" "$CARGO_TARGET_DIR/image/initramfs.cpio.gz" > "$CARGO_TARGET_DIR/image/manifest.txt"
          {
            echo '```'
            cat kernel/out/base/kernel.release "$CARGO_TARGET_DIR/image/busybox.version" "$CARGO_TARGET_DIR/image/oos-dev.img.sha256"
            grep '  kernel/' "$CARGO_TARGET_DIR/image/manifest.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Validate release artifacts
        run: |
          test -s "$CARGO_TARGET_DIR/image/oos-dev.img"
          test -s "$CARGO_TARGET_DIR/image/oos-dev.build"
          test -s "$CARGO_TARGET_DIR/image/oos-dev.models"
          test -s "$CARGO_TARGET_DIR/image/manifest.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: oos-image
          path: |
            ${{ env.CARGO_TARGET_DIR }}/image/oos-dev.img
            ${{ env.CARGO_TARGET_DIR }}/image/oos-dev.img.sha256
            ${{ env.CARGO_TARGET_DIR }}/image/oos-dev.build
            ${{ env.CARGO_TARGET_DIR }}/image/oos-dev.models
            ${{ env.CARGO_TARGET_DIR }}/image/busybox.version
            ${{ env.CARGO_TARGET_DIR }}/image/manifest.txt
            kernel/out/base/SHA256SUMS
            kernel/out/base/config
          if-no-files-found: error
