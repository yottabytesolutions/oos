# The gate for every pull request and every merge-queue group, split into parallel jobs on GitHub-hosted runners.
# Required checks (.github/rulesets/main.json): fast, clippy, test, python, deny. pr-meta, privacy and codex-review
# come from their own workflows. No secrets; the token is read-only.
# No branch or path filter on pull_request: a stacked layer targets the branch below it, not main (ADR 0034,
# xtask/src/stack_ci.rs).
# Every job always reports its required name. tools/ci/changes.py decides whether its build steps run: a change to
# documents, GitHub settings or CI scripts only skips clippy, the tests and deny; a merge-queue group with the tree of
# its PR head skips the checks that already passed there. A push to main is the only run that saves the Rust caches,
# one per job kind; PRs and groups only restore them. The merge queue already ran the gate on that tree, so the push
# run builds the tests without running them; the other jobs are cheap or are their own warm-up (clippy).
# Pull requests run the debug tests only. Release-profile tests (Cargo profile test-release: no fat LTO, same
# optimisation level, no debug assertions) run in the merge queue and in main.yml nightly.
name: PR
on:
  pull_request:
  merge_group:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # the ratchet files are compared with the merge base of the target branch (xtask/src/base.rs)
  OOS_GATE_BASE: origin/${{ github.event.pull_request.base.ref || 'main' }}
  # tools/ci/changes.py
  EVENT: ${{ github.event_name }}
  BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
  QUEUE_REF: ${{ github.event.merge_group.head_ref }}
  REPO: ${{ github.repository }}
  SAVE_CACHE: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' }}
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci/changes.py --scope all --check fast
      - name: Pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.run == 'true'
        with:
          cache-workspace-crates: true
          shared-key: fast
          save-if: ${{ env.SAVE_CACHE }}
      - name: Fast gate (fmt, size, architecture, statics, unsafe, ignores, agent rules, test time, links, text)
        if: steps.changes.outputs.run == 'true'
        run: cargo xtask check --fast
      # Host scripts stay POSIX sh for Linux, the BSDs and macOS; the runner image has shellcheck.
      - name: Host scripts (shellcheck --shell=sh)
        if: steps.changes.outputs.run == 'true'
        run: python3 -I tools/ci/host_scripts.py check
      # ADR 0035: informational, never fails. A pull request may add lines; a release that grows must say why.
      - name: Production code change against the base
        if: ${{ !cancelled() && steps.changes.outputs.run == 'true' && github.event_name == 'pull_request' }}
        continue-on-error: true
        run: |
          set -eu
          table=$(cargo xtask loc --compare "$BASE")
          printf '### Production code\n\nInformational (ADR 0035): the release, not each pull request, must shrink.\n\n%s\n' \
            "$table" >> "$GITHUB_STEP_SUMMARY"

  # Cargo serializes builds in a target directory. Keep decoder builds and register plans off the lints' critical path.
  clippy-run:
    name: clippy (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: lints
            steps: clippy
          - name: decoders 1/3
            steps: decoders
            decoder-partition: 1/3
          - name: decoders 2/3
            steps: decoders
            decoder-partition: 2/3
          - name: decoders 3/3
            steps: decoders
            decoder-partition: 3/3
          - name: plans
            steps: plan-matrix
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: clippy (${{ matrix.name }})
        run: python3 -I tools/ci/changes.py --scope rust --check "$CHECK"
      - name: Pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.run == 'true'
        with:
          cache-workspace-crates: true
          shared-key: clippy-${{ matrix.name }}
          save-if: ${{ env.SAVE_CACHE }}
      - name: cargo xtask step ${{ matrix.steps }}
        if: steps.changes.outputs.run == 'true'
        env:
          STEPS: ${{ matrix.steps }}
          OOS_DECODER_PARTITION: ${{ matrix.decoder-partition }}
        shell: bash
        run: |
          read -ra ids <<< "$STEPS"
          cargo xtask step "${ids[@]}"

  clippy:
    needs: clippy-run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Lints, decoder configurations and register plans passed
        env:
          RESULT: ${{ needs.clippy-run.result }}
        run: test "$RESULT" = success

  # Three hash shards exclude the second-pane layout test and golden tests; each has a dedicated shard
  # (xtask/src/testrun.rs). The merge queue adds release tests, also sharded; main.yml runs them nightly.
  # A push to main builds both profiles unsharded for the caches.
  test-run:
    name: test (${{ matrix.profile }} ${{ matrix.shard }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      checks: read
      pull-requests: read
    strategy:
      fail-fast: false
      matrix:
        profile: ${{ fromJSON(github.event_name == 'pull_request' && '["debug"]' || '["debug","release"]') }}
        shard: ${{ fromJSON(github.event_name == 'push' && '["build"]' || '["1/5","2/5","3/5","4/5","5/5"]') }}
    env:
      # xtask/src/testrun.rs: cargo-nextest runs the test binaries in parallel; doctests through cargo test.
      OOS_TEST_PARTITION: ${{ matrix.shard != 'build' && matrix.shard || '' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
          CHECK: test (${{ matrix.profile }} ${{ matrix.shard }})
        run: python3 -I tools/ci/changes.py --scope rust --check "$CHECK"
      - name: Pinned toolchain (rust-toolchain.toml)
        if: steps.changes.outputs.run == 'true'
        run: rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        if: steps.changes.outputs.run == 'true'
        with:
          cache-workspace-crates: true
          shared-key: test-${{ matrix.profile }}
          save-if: ${{ env.SAVE_CACHE }}
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: steps.changes.outputs.run == 'true' && env.SAVE_CACHE != 'true'
        with:
          tool: cargo-nextest@0.9.151
      - name: Tests (${{ matrix.profile }} ${{ matrix.shard }})
        if: steps.changes.outputs.run == 'true' && env.SAVE_CACHE != 'true'
        env:
          STEP: tests-${{ matrix.profile }}
        run: cargo xtask step "$STEP"
      # The same per-crate builds as the tests step (crate list: xtask/src/repo.rs CRATES), without running them.
      - name: Build the tests for the cache (push to main)
        if: steps.changes.outputs.run == 'true' && env.SAVE_CACHE == 'true'
        env:
          PROFILE: ${{ matrix.profile }}
        shell: bash
        run: |
          flags=(--locked --no-run)
          if [ "$PROFILE" = release ]; then flags+=(--profile test-release); fi
          for crate in hal dsp core ui fpgad xtask; do
            (cd "$crate" && cargo test "${flags[@]}")
          done

  # One required name for every profile and shard.
  test:
    needs: test-run
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Both profiles passed
        env:
          RESULT: ${{ needs.test-run.result }}
        run: test "$RESULT" = success

  python:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      OOS_PYTHON_NO_RUST: "1"
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci/changes.py --scope all --check python
      # script-syntax checks the one mksh script with mksh.
      - name: mksh
        if: steps.changes.outputs.run == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends mksh
      - name: Script syntax and Python tests (tools/tests, tools/privacy, ui/tools)
        if: steps.changes.outputs.run == 'true'
        run: |
          python3 -I tools/script_syntax.py
          python3 -I tools/python_tests.py

  deny:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Changes
        id: changes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 -I tools/ci/changes.py --scope rust --check deny
      - uses: taiki-e/install-action@682ce6c3c696a4cd5168a05f98e51aa02b877941 # v2.89.1
        if: steps.changes.outputs.run == 'true'
        with:
          tool: cargo-deny@0.20.2
      # cargo-deny only reads the metadata: the runner's stable cargo does that, the pinned toolchain is not needed.
      - name: Licences, advisories, bans, sources (deny.toml)
        if: steps.changes.outputs.run == 'true'
        env:
          RUSTUP_TOOLCHAIN: stable
        run: cargo deny --locked check

  # Not required: where the time went, as the run's job summary.
  timings:
    needs: [fast, clippy-run, clippy, test-run, test, python, deny]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: tools/ci
          persist-credentials: false
      - name: Job and step durations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          ATTEMPT: ${{ github.run_attempt }}
        run: python3 -I tools/ci/run_summary.py --repo "$REPO" --run "$RUN_ID" --attempt "$ATTEMPT" --exclude timings
