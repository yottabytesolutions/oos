# PR metadata (tools/ci/pr_meta.py): branch name, Conventional Commit title, DCO sign-off on every commit, GitHub-hosted
# runner labels only; size, task link and agent-label warnings as annotations. Own workflow so that a title or label
# edit reruns only this check, not the whole gate.
name: PR meta
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, labeled, unlabeled]
  merge_group:
permissions:
  contents: read
concurrency:
  group: pr-meta-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  pr-meta:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Pull request rules
        if: github.event_name == 'pull_request'
        env:
          PR_HEAD_REF: ${{ github.event.pull_request.head.ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ toJSON(github.event.pull_request.labels.*.name) }}
        run: python3 -I tools/ci/pr_meta.py pr
      # The group commit holds PRs that passed the rules above; only the runner rule applies to the merged tree.
      - name: Runner labels
        if: github.event_name == 'merge_group'
        run: python3 -I tools/ci/pr_meta.py runners
