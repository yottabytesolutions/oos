# Architecture rules for oos-ui, checked by tools/check/ in the gate.
# Format is provisional until it matches the shared checker's format (auxout). Semantics are fixed:
# - a module may name only the modules listed in `may_use`; `forbid` lists paths it must never name;
# - the checker scans every path in the source, `use` lines and fully qualified paths inside expressions alike;
# - a module belongs to the layer whose `modules` entry is its longest matching prefix
#   (`picture::window` is domain, the rest of `picture` is application).
# Ownership (who may write which state) is enforced by visibility in the code, not here
# (architecture.md#enforced-by-visibility).

[limits]                       # architecture.md#size-limits, adr/0010
file_lines = 400               # test modules excluded
fn_lines = 60
struct_fields = 12             # plain data records exempt, see adr/0010
allowlist = "tools/check/size-allowlist.txt"   # shrink-only

[layer.domain]                 # architecture.md#layers
modules = ["settings", "command", "change", "picture::window", "records::measure"]
may_use = ["oos_dsp", "std", "settings", "command", "change"]
forbid = [
  "std::fs", "std::net", "std::thread", "std::time::Instant", "std::time::SystemTime",
  "libc", "oos_hal", "crate::board",
]

[layer.application]
modules = ["app", "picture", "records", "compose", "views", "menus"]
may_use = ["domain", "ports", "oos_dsp", "std"]
forbid = ["oos_hal", "libc", "std::fs", "std::net"]

[layer.ports]                  # architecture.md#ports-and-adapters
traits = [
  "board::Board",
  "display::Present",
  "input::Source",
  "clock::Clock",
  "instruments::Bulk",
  "protocols::Protocol",
]

[layer.adapters]
modules = ["board::dho", "display", "input", "remote", "store", "system", "instruments", "protocols"]
may_use = ["domain", "ports", "std", "libc"]
no_cross = true                # adapters do not use each other

[exclusive]                    # one user per outside interface
"oos_hal::dho" = ["board::dho"]
"drm" = ["display"]
"gpu" = ["display"]
"vpu" = ["display"]
