[package]
name = "oos-dsp"
version = "0.1.13"
repository = "https://github.com/deckerjulian/oos"
edition = "2021"
description = "OOS signal processing: software triggers, measurements, math, signal generators"
license = "GPL-2.0-or-later"

[lib]
name = "oos_dsp"

# The lint set of every crate (docs/development.md). Existing findings are held by the clippy ratchet of
# `cargo xtask check`; new ones fail it.
[lints.rust]
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[dependencies]
