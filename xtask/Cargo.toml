[package]
name = "xtask"
version = "0.2.1"
edition = "2021"
description = "The repository gate: cargo xtask check (docs/development.md)"
license = "GPL-2.0-or-later"
publish = false

[lints]
workspace = true

[dependencies]
proc-macro2 = { version = "1", features = ["span-locations"] }
pulldown-cmark = { version = "0.13", default-features = false }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
syn = { version = "3", features = ["full", "visit"] }

[dev-dependencies]
# Test-only: the workflows are YAML (src/stack_ci.rs). No default features: no encoding detection.
yaml-rust2 = { version = "0.13", default-features = false }
