[package]
name = "oos-hal"
version = "0.2.0"
repository = "https://github.com/yottabytesolutions/oos"
edition = "2021"
description = "OOS hardware layer for the Rigol DHO800/DHO900: FPGA register sequences (SCU, SPU, TPU), front panel"
license = "GPL-2.0-or-later"

[lib]
name = "oos_hal"

# The lint set of every crate (docs/development.md). Existing findings are held by the clippy ratchet of
# `cargo xtask check`; new ones fail it.
[lints.rust]
unused = { level = "warn", priority = -1 }
missing_debug_implementations = "warn"

[lints.clippy]
all = { level = "warn", priority = -1 }
too_many_lines = "warn"
cognitive_complexity = "warn"
too_many_arguments = "warn"
type_complexity = "warn"
large_enum_variant = "warn"
unwrap_used = "warn"
undocumented_unsafe_blocks = "warn"
missing_safety_doc = "warn"

[dependencies]
ed25519-dalek = { version = "2.2", default-features = false }
miniz_oxide = { version = "0.8", default-features = false }
sha2 = { version = "0.10", default-features = false }
libc = "0.2"

[dev-dependencies]
curve25519-dalek = { version = "4.1", default-features = false }
